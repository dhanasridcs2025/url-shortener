<!DOCTYPE html>
<html>
<head>
    <title>Shorten URL</title>
</head>
<body>
<h1>Welcome to the URL Shortener</h1>

<h2>Stored URLs</h2>
<ul>
    {% for url in urls %}
        <li>
            <a href="{{ url.short_url }}">{{ url.short_url }}</a> → {{ url.long_url }}
        </li>
    {% empty %}
        <p>No URLs stored yet.</p>
    {% endfor %}
</ul>

<h2>Shorten a New URL</h2>
<form method="post" action="{% url 'shorten_url' %}">
    {% csrf_token %}
    <input type="url" name="long_url" placeholder="Enter a long URL" required>
    <input type="submit" value="Shorten">
</form>
</body>
</html>
